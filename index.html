<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#ffd928">
  <title>プロンプト自販機｜チップ商会</title>
  <meta name="description" content="押すだけで、AIへの頼み方が出てくる。チップ商会のプロンプト自販機。">
  <meta property="og:type" content="website">
  <meta property="og:title" content="プロンプト自販機｜チップ商会">
  <meta property="og:description" content="押すだけで、AIへの頼み方が出てくる。">
  <meta property="og:url" content="https://vending.chipshokai.com">
  <meta property="og:image" content="https://vending.chipshokai.com/assets/can.jpg">
  <meta name="twitter:card" content="summary_large_image">
  <link rel="icon" href="assets/can.jpg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Mochiy+Pop+One&family=M+PLUS+Rounded+1c:wght@500;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.3/dist/confetti.browser.min.js" defer></script>
  <script src="app.js" defer></script>
</head>
<body>
  <div class="rays" aria-hidden="true"></div>
  <header class="masthead">
    <h1 class="logo"><span class="logo-sm">プロンプト</span><span class="logo-lg">自販機</span></h1>
    <p class="subtitle">押すだけで、AIへの頼み方が出てくる</p>
  </header>

  <main id="app" class="app-shell">
    <section id="machine-view" class="machine-view" aria-label="プロンプトを選ぶ">
      <div class="stage" id="stage">
        <div class="greeter">
          <div class="clerk-wrap" id="clerk-wrap"><img src="assets/clerk.webp" alt="チップ商会の店員さん"></div>
          <p class="speech clerk-speech" id="clerk-speech">いらっしゃい！ 何にする？</p>
        </div>

        <div class="machine-wrap" id="machine-wrap">
          <div class="burst" aria-hidden="true"><span>レアも<br>あるよ！</span></div>
          <div class="machine">
            <img class="machine-art" src="assets/machine.webp" alt="" width="1024" height="1536">
            <div class="sign"><span>PROMPT</span></div>
            <div class="shelf" id="display-cans"></div>
            <div class="buttons" id="category-buttons" aria-label="やりたいこと"></div>
            <div class="win-lamp" id="win-lamp" aria-hidden="true">あたり</div>
            <div class="outlet" aria-hidden="true"><span class="drop-can" id="drop-can"></span></div>
            <div class="coin" id="coin" aria-hidden="true">100</div>
          </div>
        </div>

        <div class="onomatopoeia" id="onomatopoeia" aria-hidden="true"></div>
        <div class="can-flight" id="can-flight" aria-hidden="true"><img src="assets/can.jpg" alt=""></div>
      </div>
      <div id="loading" class="loading">プロンプトを準備中…</div>
      <div id="error-message" class="error-message" hidden></div>
    </section>

    <section id="result-view" class="result-view" hidden aria-live="polite">
      <article class="result-card" id="result-card">
        <div class="result-topline">
          <span id="result-category" class="category-tag"></span>
          <span id="rare-badge" class="rare-badge" hidden>★ レア</span>
        </div>
        <h2 id="result-title"></h2>
        <span class="ai-badge">ChatGPT・Claudeで使えます</span>
        <div id="prompt-body" class="prompt-body" tabindex="0" aria-label="プロンプト本文"></div>
        <p id="result-tip" class="result-tip"></p>
        <div class="result-actions">
          <button id="copy-prompt" class="button button-copy" type="button">📋 コピー</button>
          <button id="buy-again" class="button button-again" type="button">🥫 もう1本買う</button>
          <button id="open-share" class="button button-share" type="button">📣 シェア</button>
          <a class="button button-diagnosis" href="https://shindan.chipshokai.com" target="_blank" rel="noopener noreferrer">🔍 AI診断もやってみる</a>
        </div>
        <div class="follow-box">
          <strong>チップ商会をフォロー</strong>
          <nav class="social-links" aria-label="チップ商会公式リンク">
            <a href="https://chipshokai.com" target="_blank" rel="noopener noreferrer"><span aria-hidden="true">🏠</span>公式サイト</a>
            <a href="https://x.com/chip_shokai" target="_blank" rel="noopener noreferrer"><span aria-hidden="true">𝕏</span>X</a>
            <a href="https://note.com/chip_shokai" target="_blank" rel="noopener noreferrer"><span aria-hidden="true">📖</span>note</a>
          </nav>
        </div>
      </article>
    </section>
  </main>

  <div id="share-overlay" class="share-overlay" hidden>
    <button class="overlay-backdrop" id="share-backdrop" aria-label="シェアを閉じる"></button>
    <section class="share-panel" role="dialog" aria-modal="true" aria-labelledby="share-title">
      <button class="close-share" id="close-share" type="button" aria-label="閉じる">×</button>
      <div class="share-clerk">
        <img src="assets/clerk.webp" alt="">
        <div class="speech">みんなにも<br>教えてあげて！</div>
      </div>
      <h2 id="share-title">この1本をシェア</h2>
      <div class="share-options">
        <a id="share-x" class="share-option brand-x" target="_blank" rel="noopener noreferrer"><span>𝕏</span><b>X</b></a>
        <a id="share-line" class="share-option brand-line" target="_blank" rel="noopener noreferrer"><span>L</span><b>LINE</b></a>
        <a id="share-facebook" class="share-option brand-facebook" target="_blank" rel="noopener noreferrer"><span>f</span><b>Facebook</b></a>
        <a id="share-threads" class="share-option brand-threads" target="_blank" rel="noopener noreferrer"><span>@</span><b>Threads</b></a>
        <button id="share-native" class="share-option brand-native" type="button" hidden><span>↗</span><b>その他</b></button>
        <button id="copy-url" class="share-option brand-copy" type="button"><span>🔗</span><b>URLコピー</b></button>
      </div>
      <p class="share-note">投稿する前に、内容を確認できます。</p>
    </section>
  </div>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <footer class="site-footer">
    <a class="byline" href="https://chipshokai.com" target="_blank" rel="noopener noreferrer">by チップ商会</a>
    <nav class="footer-links" aria-label="チップ商会">
      <a href="https://chipshokai.com" target="_blank" rel="noopener noreferrer" aria-label="公式サイト">🏠</a>
      <a href="https://x.com/chip_shokai" target="_blank" rel="noopener noreferrer" aria-label="X">𝕏</a>
      <a href="https://note.com/chip_shokai" target="_blank" rel="noopener noreferrer" aria-label="note">📖</a>
    </nav>
  </footer>
</body>
</html>
